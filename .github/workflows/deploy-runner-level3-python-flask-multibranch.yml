name: "Skenario 2 - Level 3 - Deploy Flask multi-branch (self-hosted VM-B)"

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'skenario2-self-hosted-runner/level3-python-flask-multibranch/app/**'

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch yang ingin dideploy'
        required: true
        type: choice
        options:
          - main
          - staging
        default: main

  schedule:
    - cron: '0 3 * * 1'

jobs:
  deploy:
    name: Deploy Flask app langsung di VM-B
    runs-on: [self-hosted, vm-b]

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Tentukan target folder
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${{ inputs.branch }}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi

          if [[ "$BRANCH" == "staging" ]]; then
            echo "dir=/opt/level3-flask-vmb/staging" >> "$GITHUB_OUTPUT"
          else
            echo "dir=/opt/level3-flask-vmb/main" >> "$GITHUB_OUTPUT"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Tampilkan target
        run: |
          echo "Branch: ${{ steps.target.outputs.branch }}"
          echo "Folder: ${{ steps.target.outputs.dir }}"

      - name: Salin kode Flask
        run: |
          mkdir -p "${{ steps.target.outputs.dir }}"

          cp skenario2-self-hosted-runner/level3-python-flask-multibranch/app/app.py \
             "${{ steps.target.outputs.dir }}/"

          cp skenario2-self-hosted-runner/level3-python-flask-multibranch/app/requirements.txt \
             "${{ steps.target.outputs.dir }}/"

      - name: Install dependency
        run: |
          /opt/level3-flask-vmb/venv/bin/pip install \
            -r "${{ steps.target.outputs.dir }}/requirements.txt"

      - name: Update service
        run: |
          sudo sed -i \
            "s#^WorkingDirectory=.*#WorkingDirectory=${{ steps.target.outputs.dir }}#" \
            /etc/systemd/system/level3-flask-vmb.service

          sudo systemctl daemon-reload
          sudo systemctl enable level3-flask-vmb
          sudo systemctl restart level3-flask-vmb

      - name: Verifikasi service
        run: |
          sleep 2
          sudo systemctl is-active --quiet level3-flask-vmb
          curl --fail --max-time 10 http://127.0.0.1:5000
